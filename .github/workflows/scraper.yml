name: Run Scraper

on:
  schedule:
    - cron: "0 2 * * *"   # каждый час
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyvirtualdisplay

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Setup Chrome & chromedriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Check Chrome & Driver versions
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Run scraper
        run: python -u scraper.py
        env:
          COPART_USER: ${{ secrets.COPART_USER }}
          COPART_PASS: ${{ secrets.COPART_PASS }}
          FLASK_CLEAR_URL: ${{ secrets.FLASK_CLEAR_URL }}
          FLASK_UPLOAD_URL: ${{ secrets.FLASK_UPLOAD_URL }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-screenshots
          path: login_error.png
          if-no-files-found: ignore
